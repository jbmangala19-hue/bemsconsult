{% extends 'base.html' %}
{% load static %}

{% block nav %}{% endblock %}

{% block content %}
<section class="app-section">
  <div class="row g-0">
    <div class="col-lg-6 card px-5">
        <a href="/" class="nav-logo d-block mb-4">
            <img src="{% static 'images/logo.png' %}" height="120" width="150" alt="Bems Consult logo">
        </a>
        <div class="text-center mb-4">
            <div class="section-tag">Abonnez-vous à notre newsletter</div>
            <h2 class="section-title">Créez votre compte</h2>
        </div>
        <form class="mb-3" method="post" action="{% url 'inscription' %}">
            {% csrf_token %}
            <div class="row g-2 mb-4">
                <div class="col-lg-6 mb-2">
                  <label class="section-sub">Nom complet</label>
                  <input class="form-control" type="text" name="nom" placeholder="Entrez votre nom complet" required>
                </div>
                <div class="col-lg-6 mb-2">
                  <label class="section-sub">Téléphone (facultatif)</label>
                  <input class="form-control" type="text" name="tel" placeholder="Entrez votre numéro">
                </div>
                <div class="col-lg-6 mb-2">
                  <label class="section-sub">Adresse e-mail</label>
                  <input class="form-control" type="email" name="email" placeholder="exemple@gmail.com" required>
                </div>
                <div class="col-lg-6 mb-2">
                  <label class="section-sub">Mot de passe</label>
                  <input class="form-control" type="password" name="password" placeholder="Min. 8 caractères" required>
                </div>
            </div>
            {% if error %}
                <p class="sec-badge-desc text-danger mt-3" role="alert">{{ error }}</p>
            {% endif %}
            <div class="hero-btns mt-4">
                <button type="submit" class="btn-hero">
                    Valider
                    <svg viewBox="0 0 16 16"><line x1="3" y1="8" x2="13" y2="8"/><polyline points="9,4 13,8 9,12"/></svg>
                </button>
                <a href="/" class="btn-secondary">Accueil</a>
            </div>
        </form>

        <a href="/connexion" class="mt-2 mb-5 d-block text-center sec-badge-desc">Vous avez déjà un compte ? Connectez-vous</a>
    </div>
    <div class="col-lg-6">
      <img src="{% static 'images/_DSC9426.jpg' %}" loading="lazy" class="h-100 w-100" alt="histoire">
    </div>
  </div>
</section>

{% endblock %}
