<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Erreur{% endblock %} ? Bems Consult</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #172b46; font-family: Arial, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: 100%; max-width: 640px; padding: clamp(24px, 6vw, 64px); background: white; border-radius: 20px; box-shadow: 0 12px 48px #172b4610; }
    .brand { color: #172b46; font-size: 24px; font-weight: bold; text-decoration: none; }
    .code { margin: 40px 0 12px; color: #b48636; font-size: clamp(64px, 15vw, 100px); font-weight: bold; }
    h1 { font-size: clamp(24px, 5vw, 32px); }
    p { line-height: 1.7; }
    .button { display: inline-block; margin-top: 24px; padding: 16px 24px; border-radius: 8px; background: #172b46; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #b48636; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="error-title">
      <a href="/" class="brand">Bems Consult</a>
      <p class="code">{% block code %}{% endblock %}</p>
      <h1 id="error-title">{% block heading %}{% endblock %}</h1>
      <p>{% block description %}{% endblock %}</p>
      <a href="/" class="button">Retour ? l?accueil</a>
    </section>
  </main>
</body>
</html>
